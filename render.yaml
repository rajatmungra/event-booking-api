# Render Blueprint: creates the API and its Postgres database from this file.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: event-booking-api
    runtime: docker
    plan: free
    dockerCommand: sh scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: event-booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret once and keeps it
      - key: SEED_PASSWORD
        sync: false # Render asks you for this value when you create the Blueprint

databases:
  - name: event-booking-db
    plan: free
    databaseName: event_booking
    postgresMajorVersion: "16"
