services:
  api:
    build: .
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"  # host 5432/5433 are already used on this machine
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
